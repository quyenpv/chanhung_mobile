name: chanhung
description: "ChanHung ERP Customer App By Branditta"
publish_to: 'none'
version: 1.1.33+39

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.19.0
  get: ^4.6.6
  http: ^1.2.2
  introduction_screen: ^3.1.14
  flutter_svg: ^2.0.4
  lottie: ^3.1.3
  shared_preferences: ^2.0.13
  flutter_widget_from_html: ^0.15.2
  flutter_spinkit: ^5.1.0
  cached_network_image: ^3.3.1
  file_picker: ^8.1.3
  image_picker: ^1.1.2
  nb_utils: ^7.0.6
  flutter_html: ^3.0.0-beta.2
  contained_tab_bar_view: ^0.8.0
  web: ^1.1.0
  fluttertoast: ^8.2.14
  url_launcher: ^6.3.2
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  local_auth: ^2.3.0

  # Chấm công thông minh
  geolocator: ^13.0.2
  google_mlkit_face_detection: ^0.11.0
  camera: ^0.11.0

  # Push Notifications
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0

  # Theo dõi vị trí nền
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0
  flutter_background_service_ios: ^5.0.3

  # WebRTC Realtime Audio Streaming
  flutter_webrtc: ^0.12.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/animation/
    - assets/lang/

  fonts:
    - family: Montserrat-Arabic
      fonts:
        - asset: assets/fonts/Montserrat-Arabic-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Arabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Arabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Arabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Arabic-Bold.ttf
          weight: 700

dependency_overrides:
  device_info_plus: 10.1.2
