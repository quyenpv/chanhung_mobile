name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      # Không dùng actions/checkout: GitHub hay trả 429 khi tải action zip.
      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 6 ]; then
                return 1
              fi
              echo "Thu lai ($n/6) sau $((n * 10))s..."
              sleep $((n * 10))
            done
          }
          cd "$GITHUB_WORKSPACE"
          if [ ! -d .git ]; then
            git init
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          retry git fetch --prune --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          git clean -ffd || true

      - name: Set up Java and Flutter
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1 && [[ -z "${JAVA_HOME:-}" ]]; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y openjdk-17-jdk
            else
              echo "Runner can Java 17 (JAVA_HOME) vi workflow khong tai actions/setup-java (tranh GitHub 429)."
              exit 1
            fi
          fi
          java -version || true

          if command -v flutter >/dev/null 2>&1; then
            flutter --version
            exit 0
          fi
          FLUTTER_DIR="${RUNNER_TEMP:-$HOME}/flutter-sdk"
          if [ ! -x "$FLUTTER_DIR/bin/flutter" ]; then
            git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          fi
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$FLUTTER_DIR/bin:$PATH"
          flutter --version

      - name: Check Android release signing
        id: signing
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |
          required=(
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_UPLOAD_KEY_ALIAS
            ANDROID_UPLOAD_KEY_PASSWORD
            ANDROID_UPLOAD_STORE_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android release signing is not configured. Building a debug APK only. Missing: ${missing[*]}"
            {
              echo "### Android signing not configured"
              echo "A debug APK was built because these repository secrets are missing: \`${missing[*]}\`."
              echo "Release APK/AAB publishing remains disabled until the upload-key secrets are added."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Android release signing
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |

          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/chanhung-erp-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_UPLOAD_STORE_PASSWORD
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          storeFile=chanhung-erp-upload.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build ERP APK release
        if: steps.signing.outputs.configured == 'true'
        run: flutter build apk --release --flavor erp -t lib/main.dart --build-number=$((50 + GITHUB_RUN_NUMBER)) --android-skip-build-dependency-validation

      - name: Build Chat APK release
        if: steps.signing.outputs.configured == 'true'
        run: flutter build apk --release --flavor chat -t lib/main_chat.dart --build-number=$((50 + GITHUB_RUN_NUMBER)) --android-skip-build-dependency-validation

      - name: Build ERP Android App Bundle release
        if: steps.signing.outputs.configured == 'true'
        run: flutter build appbundle --release --flavor erp -t lib/main.dart --build-number=$((50 + GITHUB_RUN_NUMBER)) --android-skip-build-dependency-validation

      - name: Build Chat Android App Bundle release
        if: steps.signing.outputs.configured == 'true'
        run: flutter build appbundle --release --flavor chat -t lib/main_chat.dart --build-number=$((50 + GITHUB_RUN_NUMBER)) --android-skip-build-dependency-validation

      - name: Build debug APKs fallback
        if: steps.signing.outputs.configured != 'true'
        run: |
          flutter build apk --debug --flavor erp -t lib/main.dart --build-number=$((50 + GITHUB_RUN_NUMBER)) --android-skip-build-dependency-validation
          flutter build apk --debug --flavor chat -t lib/main_chat.dart --build-number=$((50 + GITHUB_RUN_NUMBER)) --android-skip-build-dependency-validation

      - name: Extract App Version
        id: versioning
        shell: bash
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //g' | tr -d ' ' | tr -d '\r')
          CLEAN_VER=$(echo $VERSION | cut -d'+' -f1)
          BUILD_NUM=$(echo $VERSION | cut -d'+' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "clean_ver=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "build_num=$BUILD_NUM" >> "$GITHUB_OUTPUT"

      - name: Publish Release to Public quyenpv/chanhung_mobile_releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN || secrets.GH_RELEASES_TOKEN || secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: quyenpv/chanhung_mobile_releases
        run: |
          TAG="v${{ steps.versioning.outputs.clean_ver }}"
          VERSION="${{ steps.versioning.outputs.version }}"

          echo "=== 1. Khoi tao repository phat hanh neu con trong ==="
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPOSITORY}.git" target_repo || true
          if [ -d "target_repo" ]; then
            cd target_repo
            if [ ! -f "README.md" ]; then
              echo "# ChanHung Mobile Releases" > README.md
              echo "Kho phan phoi file APK chinh thuc cua ung dung ChanHung Mobile." >> README.md
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add README.md
              git commit -m "chore: Initialize repository for APK releases" || true
              git branch -M main
              git push origin main || true
            fi
            cd ..
          fi

          echo "=== 2. Thu thap cac tep APK ==="
          mkdir -p release_apks
          find build/app/outputs -name "*.apk" -exec cp {} release_apks/ \;
          ls -la release_apks/

          echo "=== 3. Xuat ban Release sang $RELEASE_REPOSITORY ==="
          gh release create "$TAG" release_apks/*.apk \
            --repo "$RELEASE_REPOSITORY" \
            --target main \
            --title "ChanHung Mobile v$VERSION" \
            --notes "Bản cập nhật ChanHung Mobile v$VERSION hỗ trợ tải trực tiếp file APK." || \
          gh release upload "$TAG" release_apks/*.apk \
            --repo "$RELEASE_REPOSITORY" \
            --clobber

      - name: Auto Sync Latest Version to ERP Server Settings
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          TAG="v${{ steps.versioning.outputs.clean_ver }}"
          VERSION="${{ steps.versioning.outputs.version }}"
          CLEAN_VER="${{ steps.versioning.outputs.clean_ver }}"
          echo "=== 4. Tu dong dong bo phien ban $CLEAN_VER vao ERP Settings ==="
          curl -s -k -X POST "https://erp.chanhungltd.info.vn/api/v1/app_config/sync_version" \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"chanhung_release_sync_2026\",\"latest_app_version\":\"$CLEAN_VER\",\"update_changelog\":\"Bản cập nhật ChanHung Mobile v$VERSION hỗ trợ tải trực tiếp file APK.\",\"github_release_url\":\"https://github.com/quyenpv/chanhung_mobile_releases/releases/tag/$TAG\",\"apk_download_url\":\"https://github.com/quyenpv/chanhung_mobile_releases/releases/download/$TAG/app-erp-release.apk\"}" || true

      - name: Google Play publish skipped
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::warning::AAB da build xong. Bo qua upload-google-play action de tranh GitHub 429; tai AAB tu release neu can dang Play Console."
          else
            echo "PLAY_SERVICE_ACCOUNT_JSON chua cau hinh; bo qua Google Play."
          fi
