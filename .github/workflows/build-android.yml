name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Android release signing
        id: signing
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |
          required=(
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_UPLOAD_KEY_ALIAS
            ANDROID_UPLOAD_KEY_PASSWORD
            ANDROID_UPLOAD_STORE_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android release signing is not configured. Building a debug APK only. Missing: ${missing[*]}"
            {
              echo "### Android signing not configured"
              echo "A debug APK was built because these repository secrets are missing: \`${missing[*]}\`."
              echo "Release APK/AAB publishing remains disabled until the upload-key secrets are added."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Android release signing
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |

          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/chanhung-erp-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_UPLOAD_STORE_PASSWORD
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          storeFile=chanhung-erp-upload.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build ERP APK release
        if: steps.signing.outputs.configured == 'true'
        run: flutter build apk --release --flavor erp -t lib/main.dart --android-skip-build-dependency-validation

      - name: Build Chat APK release
        if: steps.signing.outputs.configured == 'true'
        run: flutter build apk --release --flavor chat -t lib/main_chat.dart --android-skip-build-dependency-validation

      - name: Build ERP Android App Bundle release
        if: steps.signing.outputs.configured == 'true'
        run: flutter build appbundle --release --flavor erp -t lib/main.dart --android-skip-build-dependency-validation

      - name: Build Chat Android App Bundle release
        if: steps.signing.outputs.configured == 'true'
        run: flutter build appbundle --release --flavor chat -t lib/main_chat.dart --android-skip-build-dependency-validation

      - name: Build debug APKs fallback
        if: steps.signing.outputs.configured != 'true'
        run: |
          flutter build apk --debug --flavor erp -t lib/main.dart --android-skip-build-dependency-validation
          flutter build apk --debug --flavor chat -t lib/main_chat.dart --android-skip-build-dependency-validation

      - name: Upload ERP APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chanhung-erp-release-apk
          path: build/app/outputs/flutter-apk/app-erp-release.apk
          retention-days: 14

      - name: Upload Chat APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chanhung-chat-release-apk
          path: build/app/outputs/flutter-apk/app-chat-release.apk
          retention-days: 14

      - name: Upload ERP AAB artifact for Google Play
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chanhung-erp-release-aab
          path: build/app/outputs/bundle/erpRelease/app-erp-release.aab
          retention-days: 14

      - name: Upload Chat AAB artifact for Google Play
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chanhung-chat-release-aab
          path: build/app/outputs/bundle/chatRelease/app-chat-release.aab
          retention-days: 14

      - name: Check Google Play publishing credentials
        id: play
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is missing; AAB is ready as an artifact but was not published to Google Play."
            echo "### Google Play publish skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the repository secret \`PLAY_SERVICE_ACCOUNT_JSON\` to publish automatically to Internal testing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish AAB to Google Play Internal testing
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.chanhung.erp
          releaseFiles: build/app/outputs/bundle/erpRelease/app-erp-release.aab
          tracks: internal
          status: completed
          inAppUpdatePriority: 2

      - name: Upload ERP debug APK artifact
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chanhung-erp-debug-apk
          path: build/app/outputs/flutter-apk/app-erp-debug.apk
          retention-days: 7

      - name: Upload Chat debug APK artifact
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chanhung-chat-debug-apk
          path: build/app/outputs/flutter-apk/app-chat-debug.apk
          retention-days: 7
