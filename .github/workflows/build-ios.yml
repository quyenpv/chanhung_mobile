name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # camera_avfoundation mới cần SDK/Xcode 16+ (AVCaptureSession.*Notification).
      # macos-14 có Xcode 16.2; tránh ghim 15.4 vì sẽ fail compile.
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App Bundle (Unsigned)
        run: |
          flutter build ios --release --no-codesign
        env:
          # Tránh Flutter tự ép deployment target xuống 13.0 khi thiếu Podfile cấu hình.
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: NO

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-release.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release-ipa
          path: app-release.ipa
          retention-days: 7
