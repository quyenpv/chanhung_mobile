name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app:
          - id: erp
            entrypoint: lib/main.dart
            bundle_id: com.chanhung.erp
            display_name: ChanHung ERP
          - id: chat
            entrypoint: lib/main_chat.dart
            bundle_id: com.chanhung.chat
            display_name: ChanHung Chat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # camera_avfoundation mới cần SDK/Xcode 16+ (AVCaptureSession.*Notification).
      # macos-14 có Xcode 16.2; tránh ghim 15.4 vì sẽ fail compile.
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies with retry
        working-directory: ios
        run: |
          for i in {1..5}; do
            echo "Attempt $i: pod install..."
            pod install --repo-update && break || (echo "Retry after 5s..." && sleep 5)
          done

      - name: Configure ${{ matrix.app.display_name }} identity and Disable Code Signing
        run: |
          perl -0pi -e 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = ${{ matrix.app.bundle_id }};/g' ios/Runner.xcodeproj/project.pbxproj
          perl -0pi -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          perl -0pi -e 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${{ matrix.app.display_name }}" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${{ matrix.app.id }}" ios/Runner/Info.plist

      - name: Build ${{ matrix.app.display_name }} (Unsigned)
        run: |
          flutter build ios --release --no-codesign -t ${{ matrix.app.entrypoint }}

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" | head -n 1)
          fi
          cp -r "$APP_PATH" Payload/
          zip -r chanhung-${{ matrix.app.id }}-release-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chanhung-${{ matrix.app.id }}-ios-release-unsigned
          path: chanhung-${{ matrix.app.id }}-release-unsigned.ipa
          retention-days: 14

      - name: Extract App Version
        id: versioning
        shell: bash
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //g' | tr -d ' ' | tr -d '\r')
          CLEAN_VER=$(echo $VERSION | cut -d'+' -f1)
          echo "clean_ver=$CLEAN_VER" >> "$GITHUB_OUTPUT"

      - name: Publish IPA to Public quyenpv/chanhung_mobile_releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN || secrets.GH_RELEASES_TOKEN || secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: quyenpv/chanhung_mobile_releases
        run: |
          TAG="v${{ steps.versioning.outputs.clean_ver }}"
          gh release upload "$TAG" chanhung-${{ matrix.app.id }}-release-unsigned.ipa \
            --repo "$RELEASE_REPOSITORY" \
            --clobber || echo "::warning::Could not upload IPA to releases repo"
